# mag-loadtest configuration
# All sections and keys are optional; the values shown here are the defaults.

[server]
# Hostname or IP of the game server.
host = "127.0.0.1"
# TCP port of the game server.
port = 5555

[api]
# Base URL of the account API (HTTPS with self-signed cert accepted).
base_url = "https://127.0.0.1:5554"
# Shared account-API request rate for all simulated clients.
# The local Docker stack sees all bots as one source IP, so keep this very low.
requests_per_second = 30
# Maximum account-API requests outstanding at once. The default of 1 caps real
# throughput at 1/request_latency, and the API's server-side Argon2 hashing
# makes each request ~1s, so bootstrapping hundreds of bots takes many minutes.
# Raise this (e.g. 16) when running against a throwaway local stack.
max_in_flight = 1

[run]
# Number of bot clients to simulate concurrently.
# Each connected bot holds one persistent TCP/TLS socket to the game server
# for its whole session, plus a handful of shared keep-alive connections to
# the account API. For num_clients above a couple hundred, raise your shell's
# open-file limit before running (e.g. `ulimit -n 4096` on macOS/Linux,
# default is often 256 on macOS) or you'll see "Too many open files" (EMFILE)
# bootstrap errors once the limit is hit.
num_clients = 400
# Seconds over which all clients ramp up (connections staggered evenly).
ramp_up_secs = 5.0
# Total wall-clock test duration in seconds.
duration_secs = 1200.0
# Seconds between periodic metric summaries printed to stdout.
report_interval_secs = 10.0
# Minimum seconds between successive characters logging into the game server.
login_stagger_secs = 0.1

[movement]
# Maximum ± tile radius for random move targets around the bot's current position.
radius = 15
# Milliseconds between CL_MOVE commands.
interval_ms = 5000
# Enable one-shot login dispersion: right after a bot's first confirmed world
# position, it says the god password and then `/goto`s to a random in-bounds
# map location, before falling back to normal random movement. This spreads
# newly logged-in characters away from the shared spawn point so the server
# can keep placing new logins under heavy concurrent load.
# Requires the MAG_GOD_PASSWORD environment variable to be set (a .env file
# in the repo root is auto-loaded); the process fails fast at startup if this
# is true but MAG_GOD_PASSWORD is unset or empty.
enable_dispersion = true

[impairment]
# Fixed added outbound latency in milliseconds (0 = no impairment).
latency_ms = 0
# Random jitter applied on top of latency_ms (uniform ±jitter_ms/2).
jitter_ms = 0
# Probability [0.0, 1.0] that a move or ping packet is silently dropped.
# CL_CTICK keepalive packets are always sent; only movement and pings are dropped.
drop_pct = 0.0

[ping]
# Enable periodic CL_PING / SV_PONG round-trip latency measurement.
enabled = true
# Seconds between successive pings per client.
interval_secs = 5.0

[accounts]
# Deterministic username prefix; bot N gets username "{prefix}-{N}".
prefix = "loadtest"
# Email domain for account registration; bot N gets email "{prefix}-{N}@{domain}".
email_domain = "example.com"
# Shared password for all bot accounts.
password = "loadtest1234"
# Starting character class: "mercenary" | "templar" | "harakim" | "random"
# "random" picks one of the three per bot, seeded by the bot index so the
# same bot always gets the same class. Only applies when a bot's character is
# first created; existing characters keep their class, which is read back from
# the API and tracked per bot (it drives spell selection).
class = "random"
# Character sex: "male" | "female"
sex = "male"

# In-world behaviour. Each sub-table is an independent periodic action a bot
# performs once it has a confirmed world position. All default to disabled.
[behavior.cast]
# Periodically cast a spell/skill the server has reported as known for the
# bot's class (self-targeted buffs like Protect/Bless/Heal/Light/Enhance...).
enabled = true
# Milliseconds between cast attempts per client (each bot gets a random
# phase offset so they don't fire in lockstep).
interval_ms = 8000
# Also cast hostile spells (Blast/Curse/Stun...) at a random visible character.
# Off by default: it kills NPCs and hits other bots/players.
allow_hostile = false

[behavior.chat]
# Periodically say a chat line (regular local "say").
enabled = true
# Milliseconds between chat lines per client.
interval_ms = 30000
# Message pool; a random entry is picked each time. Leave empty for the
# built-in defaults. Avoid anything containing the god password.
messages = [
  "hello there",
  "anyone selling armor?",
  "where is the arena?",
  "lfg dungeon",
  "brb",
]

[behavior.interact]
# Periodically send CL_USE on a random usable item (ISUSABLE tile flag: doors,
# levers, portals, shrines...) visible within `radius` tiles. The server
# path-finds to it and runs the item's use handler.
enabled = true
# Milliseconds between interaction attempts per client.
interval_ms = 10000
# Maximum Chebyshev tile distance from the bot to a candidate item.
radius = 8

# Periodic slash-commands each bot client sends, each on its own interval.
# Every entry is one `[[commands]]` table with a `command` string and an
# `interval_secs` float; add as many as you like. Omit this section (or leave
# it empty) to disable periodic commands entirely.
[[commands]]
command = "/rank"
interval_secs = 1.0

[[commands]]
command = "/who"
interval_secs = 2.0

[[commands]]
command = "/help"
interval_secs = 1.5

