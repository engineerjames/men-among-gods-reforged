name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to release (e.g. v1.2.3)"
        required: true
        type: string
      steam_upload:
        description: "Also upload the client builds to Steam (see pipelines/README.md)"
        required: false
        type: boolean
        default: false
      steam_branch:
        description: "Steam beta branch to set live (blank = set live manually in Steamworks)"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build-packages:
    name: Build ${{ matrix.platform }} packages
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash pipelines/install_linux_deps.sh

      - name: Install MacOS build dependencies
        if: matrix.os == 'macos-latest'
        shell: bash
        run: bash pipelines/install_macos_deps.sh

      - name: Install cargo-vcpkg (all platforms)
        shell: bash
        run: cargo install cargo-vcpkg

      - name: Build SDL2 dependencies via vcpkg
        shell: bash
        run: cargo vcpkg -v build --manifest-path client/Cargo.toml

      # All crates inherit [workspace.package].version, which binaries report via CARGO_PKG_VERSION.
      - name: Stamp workspace version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a valid semver version (expected e.g. v1.2.3)" >&2
            exit 1
          fi
          VERSION="$VERSION" perl -0pi -e 's/(\[workspace\.package\][^\[]*?\nversion = )"[^"]*"/$1"$ENV{VERSION}"/ or die "workspace version not found\n"' Cargo.toml
          grep -n '^version = ' Cargo.toml

      - name: Build (release)
        shell: bash
        run: bash pipelines/build_release.sh

      - name: Package (linux/macos)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: >-
          bash pipelines/package.sh
          --version '${{ inputs.version }}'
          --platform '${{ matrix.platform }}'

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >-
          pwsh -File pipelines/package_windows.ps1
          -Version '${{ inputs.version }}'
          -Platform '${{ matrix.platform }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  upload-steam:
    name: Upload client to Steam
    if: inputs.steam_upload
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Unpack client packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for platform in windows macos linux; do
            unzip -q "artifacts/packages-${platform}/men-among-gods-client-${VERSION}-${platform}.zip" \
              -d "steam-content/${platform}"
          done

      - name: Install steamcmd
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1
          mkdir -p "$HOME/Steam"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$HOME/Steam"

      - name: Restore Steam credentials
        shell: bash
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/Steam/config/config.vdf"

      - name: Upload to Steam
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_MACOS: ${{ vars.STEAM_DEPOT_MACOS }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
          STEAM_BRANCH: ${{ inputs.steam_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=()
          # Platforms without a configured depot ID are skipped.
          [[ -n "$STEAM_DEPOT_WINDOWS" ]] && args+=(--depot "${STEAM_DEPOT_WINDOWS}=steam-content/windows/men-among-gods-client-${VERSION}-windows")
          [[ -n "$STEAM_DEPOT_MACOS" ]] && args+=(--depot "${STEAM_DEPOT_MACOS}=steam-content/macos/men-among-gods-client-${VERSION}-macos")
          [[ -n "$STEAM_DEPOT_LINUX" ]] && args+=(--depot "${STEAM_DEPOT_LINUX}=steam-content/linux/men-among-gods-client-${VERSION}-linux")
          bash pipelines/steam_upload.sh \
            --app-id "$STEAM_APP_ID" \
            --description "$VERSION" \
            --branch "$STEAM_BRANCH" \
            --steamcmd "$HOME/Steam/steamcmd.sh" \
            "${args[@]}"

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-packages
    permissions:
      contents: write

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create (or update) release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION='${{ inputs.version }}'

          mapfile -t FILES < <(find artifacts -type f -name '*.zip' -print)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No .zip artifacts found to upload" >&2
            exit 1
          fi

          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${FILES[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$VERSION" "${FILES[@]}" --repo "$GH_REPO" \
              --title "$VERSION" \
              --target "${GITHUB_SHA}" \
              --notes "Automated release for $VERSION"
          fi
