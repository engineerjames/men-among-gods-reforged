# strength/agility 75 -> 65, hand-to-hand/weapon skill 100 -> 90 (caps only ever lower a value).
# Areas from core/src/area.rs; Lab 8 is split in two rectangles.
- &golems
  chars: true
  name: golem
  area: 16,529,81,591
  set-armor-bonus: 55
  set-weapon-bonus: 55
  set-rank: 11
  cap-attrib: [STREN=65, AGIL=65]
  cap-skill: [hand=90, weapon=90]
- {<<: *golems, area: "15,611,126,703"}
- {<<: *golems, area: "112,703,126,708"}
